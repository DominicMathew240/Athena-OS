[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "athena-sdk"
version = "0.1.0"
description = "Open SDK and Core contracts for the Athena industrial AI standard."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.11,<3",
]

[project.urls]
Homepage = "https://github.com/DominicMathew240/Athena-OS"

[tool.setuptools.packages.find]
include = ["athena_sdk*"]
