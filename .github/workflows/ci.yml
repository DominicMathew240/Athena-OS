name: Athena Open Source CI

on:
  push:
    branches: [main, master]
    paths:
      - "**"
  pull_request:
    paths:
      - "**"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.3

      - name: Run ruff
        run: ruff check sdk/python cli examples tests

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e sdk/python -e cli
          pip install pytest

      - name: Run tests
        run: pytest -v

      - name: Verify schema generation is in sync
        run: |
          python contracts/generate_json_schema.py /tmp/generated-schemas
          diff -r contracts/v1 /tmp/generated-schemas/v1

      - name: OSS hygiene (no leaked local files)
        run: pytest -q tests/test_oss_hygiene.py

  secrets:
    name: Secret scan (working tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" \
            | tar -xz gitleaks
      - name: Scan the current tree, not git history
        run: ./gitleaks detect --no-git --redact --source . --exit-code 1
