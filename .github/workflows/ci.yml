name: Athena Open Source CI

on:
  push:
    branches: [main, master]
    paths:
      - "athena-oss/**"
  pull_request:
    paths:
      - "athena-oss/**"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: athena-oss
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check sdk/python cli examples tests

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: athena-oss
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e sdk/python -e cli
          pip install pytest

      - name: Run tests
        run: pytest -v

      - name: Verify schema generation is in sync
        run: |
          python contracts/generate_json_schema.py /tmp/generated-schemas
          diff -r contracts/v1 /tmp/generated-schemas/v1
