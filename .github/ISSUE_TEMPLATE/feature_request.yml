name: Feature request
description: Suggest an enhancement for Athena Open Source.
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature or change you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope boundary
      description: Confirm the request stays within the open-source boundary.
      options:
        - label: This request does not include proprietary model weights, training data, or closed-source Forge/Lab internals.
          required: true
