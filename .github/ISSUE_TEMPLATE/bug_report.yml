name: Bug report
description: Report a problem with Athena Open Source code, contracts, or docs.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. If you're unsure whether
        something is a bug, start a discussion issue instead.
  - type: input
    id: package
    attributes:
      label: Affected package
      description: Which Athena Open Source package or area is affected?
      placeholder: e.g. athena-sdk contracts, athena-cli, docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package or repo version you are using.
      placeholder: e.g. 0.1.0
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal code or command sequence that reproduces the issue.
      render: bash
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: OS, Python version, relevant logs, etc.
